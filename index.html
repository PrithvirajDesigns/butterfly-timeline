<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Butterfly Life Cycle</title>
<style>
  :root {
    --ink: #111;
    --muted: #9a9aa0;
    --tick: #cfcfd4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #fff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  main {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px max(36px, env(safe-area-inset-bottom));
  }

  /* ---------- Scene area (upper ~60%) ---------- */
  #stage {
    position: relative;
    width: 100%;
    height: 60dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #scene {
    position: relative;
    width: min(60vh, 86vw, 520px);
    aspect-ratio: 1;
  }
  /* Low-res WebGL canvas, upscaled with nearest-neighbour for the chunky pixel look */
  #gl {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  /* shown only if WebGL / Three.js is unavailable */
  #placeholder {
    display: none;
    position: absolute; left: 50%; top: 50%;
    width: 22%; aspect-ratio: 1;
    background: #bfd8a4;
    transform: translate(-50%, -50%);
  }
  #scene.nogl #placeholder { display: block; }
  #scene.nogl #gl { display: none; }
  /* soft floating shadow: top/width are set from JS (projected from the model's base) */
  #shadow {
    position: absolute; left: 50%; top: 78%;
    width: 60%; aspect-ratio: 7 / 1;
    transform: translate(-50%, -50%) scale(var(--shadow-scale, 1));
    background: radial-gradient(ellipse at center, rgba(0,0,0,.18) 0%, rgba(0,0,0,.08) 45%, rgba(0,0,0,0) 72%);
    filter: blur(6px);
    pointer-events: none;
  }

  /* ---------- Caption ---------- */
  #caption {
    margin-top: 28px;
    text-align: center;
    min-height: 64px;
  }
  #title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    transition: opacity .22s ease, transform .22s ease;
  }
  #title.swap { opacity: 0; transform: translateY(5px); }
  #subtitle {
    margin-top: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  #subtitle b { color: var(--ink); font-weight: 600; margin-right: 6px; }

  /* ---------- Scrubber ---------- */
  #scrubber-wrap {
    margin-top: auto;
    width: min(100%, 560px);
  }
  #scrubber {
    position: relative;
    height: 44px;
    cursor: pointer;
    touch-action: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  #scrubber:focus, #scrubber:focus-visible { outline: none; }
  /* focus ring only when the user is navigating by keyboard */
  body.kbd #scrubber:focus { outline: 2px solid rgba(0,0,0,.25); outline-offset: 6px; border-radius: 4px; }
  .tick {
    position: absolute; bottom: 0;
    width: 1.5px;
    margin-left: -0.75px;
    background: var(--tick);
    border-radius: 1px;
    will-change: height, background-color;
  }
  #thumb {
    position: absolute; bottom: 0;
    width: 2.5px; height: 44px;
    margin-left: -1.25px;
    background: var(--ink);
    border-radius: 2px;
    pointer-events: none;
  }
  #labels {
    display: flex; justify-content: space-between;
    margin-top: 10px;
    font-size: 11px;
    color: #b4b4ba;
  }
  #labels .end { color: var(--ink); font-weight: 600; }

  #hint {
    margin-top: 14px; text-align: center;
    font-size: 12px; color: var(--muted);
    transition: opacity .4s ease;
  }
  #hint.gone { opacity: 0; pointer-events: none; }

  @media (max-width: 480px) {
    main { padding-left: 18px; padding-right: 18px; }
    #title { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #title { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section id="stage" aria-hidden="false">
    <div id="scene">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div id="placeholder"></div>
      <div id="shadow"></div>
    </div>
  </section>

  <section id="caption" aria-live="polite">
    <div id="title">Egg</div>
    <div id="subtitle"><b>Monarch</b><span id="detail"></span></div>
  </section>

  <section id="scrubber-wrap">
    <div id="scrubber" role="slider" tabindex="0"
         aria-label="Monarch life cycle timeline"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
         aria-valuetext="Egg, day 0">
      <div id="thumb"></div>
    </div>
    <div id="labels"><span>Day 0</span><span class="end">Day ~30</span></div>
    <div id="hint" aria-hidden="true">Drag the timeline</div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   1. CONSTANTS  (tweak these)
   ===================================================================== */
const CONFIG = {
  BUTTERFLY_COUNT: 3,        // used by the scene in later stages
  TOTAL_DAYS: 30,            // t = 1 maps to this day count
  TICK_COUNT: 72,            // number of thin ticks
  TICK_SPACING_POWER: 1.7,   // >1 packs ticks closer together toward the right
  TICK_MIN_H: 9,             // px, leftmost tick height
  TICK_MAX_H: 30,            // px, rightmost tick height
  TICK_HEIGHT_POWER: 2.2,    // growth curve of tick height
  HIGHLIGHT_RADIUS: 0.07,    // fraction of strip width affected around the thumb
  HIGHLIGHT_BOOST_PX: 9,     // extra height for ticks next to the thumb
  TWEEN_SPEED: 9,            // higher = snappier easing toward the target t
  KEY_STEP: 0.01,            // arrow key step (Shift = x5)
  SHADOW_SCALE_MIN: 0.7,     // floor shadow scale at t=0
  SHADOW_SCALE_MAX: 1.15,    // ... and at t=1

  // --- Pixel / voxel look (Stage 2) ---
  PIXEL_SCALE: 1.25,          // CSS px per art pixel. It is rounded to a whole number of DEVICE pixels, so on phones (2-3x) this gives tiny ~1.5 px pixels. 1 = tiniest, 3-4 = chunky
  OUTLINE: true,             // thin dark outline pass
  OUTLINE_COLOR: '#23202b',
  // --- fine-pixel style (egg + hatching + scenery) ---
  DITHER_LEVELS: 12,         // colour steps per channel before dithering (fewer = more retro, more visible dither)
  DITHER_STRENGTH: 1.0,      // 0 = smooth banding, 1 = full ordered dither
  SHADOW_MAP: 2048,          // soft shadow resolution
  GROUND_TOP: -2.1,          // height of the grass surface the twigs grow from
  SLAB_DEPTH: 3.4,           // thickness of the floating earth chunk
  SLAB_MARGIN: 4.0,          // grass beyond the outermost twig base
  HAPTICS: true,             // vibration / tap feedback while scrubbing (phones)
  PROPS: true,               // tufts, flowers, pebbles, mushrooms, fallen twig
  OUTLINE_DEPTH_FACTOR: 1.25, // outline sensitivity (higher = fewer inner outlines). Scales with pixel size.
  MIN_INTERNAL_RES: 150,     // narrow screens use a finer PIXEL_SCALE so the scene keeps >= this many px
  VIEW_SIZE: 42,             // world units visible vertically (smaller = zoomed in)
  CAMERA_ELEVATION_DEG: 32,  // three-quarter view angle above the horizon
  CAMERA_AZIMUTH_DEG: 40,
  CAMERA_LOOK_Y: 8,          // world height the camera looks at
  ROTATION_SPEED: 0.12,      // slow turntable rotation, radians per second (0 = static). 0.12 = one turn per ~52 s
  GROUND_Y: -6.2,            // world height of the underside of the models
  SHADOW_DROP: 1.5,            // how far below the models the shadow floats (world units, smaller = closer)
  SHADOW_RADIUS: 13,         // shadow half-width in world units

  // --- Monarch group (Stage 3) ---
  UNIT_RADIUS: 7,          // distance of each leaf from the centre of the triangle
  UNIT_TIME_OFFSET_MAX: 0.10,// last monarch lags the first by this much of the timeline (0 / 5% / 10% for 3)
  UNIT_SIZE_VARIATION: [1.0, 0.93, 1.06], // per-monarch size multipliers (cycled)
  LIGHT_AMBIENT: 0.78,
  LIGHT_DIRECTIONAL: 0.5,
};

/* Limited flat-shaded palette (28 colours). Every voxel uses one of these. */
const PALETTE = {
  ink:        '#1d1a1f',  // wing black / caterpillar black / outlines
  white:      '#f7f5ee',  // wing dots, caterpillar stripe
  cream:      '#efe9b8',  // egg
  eggGreen:   '#a9cc7a',  // egg shade
  leafLight:  '#9bd06a',
  leafMid:    '#67ad4c',
  leafDark:   '#3f8040',
  leafShade:  '#4d9446',
  leafVein:   '#c4e38c',
  twig:       '#7b5b3a',
  twigDark:   '#573f29',
  twigLight:  '#9a7650',
  yellow:     '#f2c81f',  // caterpillar stripe
  jade:       '#86dba6',  // chrysalis
  jadeDark:   '#3fa670',
  gold:       '#e8b93a',  // chrysalis band
  chrysDark:  '#2f3b36',  // chrysalis before emergence
  orange:     '#f0801a',  // monarch wing
  orangeDark: '#cf5510',
  orangeLight:'#f8a944',
  brown:      '#8a5a2b',
  grey:       '#bfc4c8',
  wetWing:    '#e9c98a',  // crumpled wings
  pink:       '#e8a78a',
  shadowGreen:'#2c5a33',
  sky:        '#cfe8f5',
};

/* Stage timings (fractions of t). Stage 1 uses these only for the caption. */
const STAGES = [
  { id: 'egg',       from: 0.00, to: 0.12, title: 'Egg',        detail: d => `Day ${d}` },
  { id: 'hatch',     from: 0.12, to: 0.25, title: 'Hatching',   detail: d => `Day ${d}` },
  { id: 'cater',     from: 0.25, to: 0.50, title: 'Caterpillar',detail: d => `Day ${d}` },
  { id: 'jhang',     from: 0.50, to: 0.58, title: 'J-hang',     detail: d => `Day ${d}` },
  { id: 'chrysalis', from: 0.58, to: 0.80, title: 'Chrysalis',  detail: d => `Day ${d}` },
  { id: 'emerge',    from: 0.80, to: 0.90, title: 'Emerging',   detail: d => `Day ${d}` },
  { id: 'adult',     from: 0.90, to: 1.00, title: 'Butterfly',  detail: d => `Day ${d}` },
];

/* =====================================================================
   2. STATE + HELPERS
   ===================================================================== */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp01 = v => Math.min(1, Math.max(0, v));
const lerp = (a, b, k) => a + (b - a) * k;

let targetT = 0;   // where the user wants to be
let shownT  = 0;   // eased value that the scene/UI actually renders

function stageAt(t) {
  for (let i = STAGES.length - 1; i >= 0; i--) if (t >= STAGES[i].from) return STAGES[i];
  return STAGES[0];
}

/* =====================================================================
   3. SCRUBBER UI
   ===================================================================== */
const scrubber = document.getElementById('scrubber');
const thumb = document.getElementById('thumb');
const ticks = [];
const tickPos = [];

(function buildTicks() {
  const n = CONFIG.TICK_COUNT;
  for (let i = 0; i < n; i++) {
    const u = i / (n - 1);
    // spacing shrinks toward the right: x = 1 - (1-u)^p
    const x = 1 - Math.pow(1 - u, CONFIG.TICK_SPACING_POWER);
    const h = lerp(CONFIG.TICK_MIN_H, CONFIG.TICK_MAX_H, Math.pow(u, CONFIG.TICK_HEIGHT_POWER));
    const el = document.createElement('div');
    el.className = 'tick';
    el.style.left = (x * 100) + '%';
    el.dataset.h = h;
    el.style.height = h + 'px';
    scrubber.insertBefore(el, thumb);
    ticks.push(el); tickPos.push(x);
  }
})();

// colour blend between resting tick grey and ink
const C0 = [207, 207, 212], C1 = [17, 17, 17];
function paintScrubber(t) {
  thumb.style.left = (t * 100) + '%';
  const r = CONFIG.HIGHLIGHT_RADIUS;
  for (let i = 0; i < ticks.length; i++) {
    const d = (tickPos[i] - t) / r;
    const k = Math.exp(-d * d);                       // 0..1 falloff around the thumb
    const h = +ticks[i].dataset.h + k * CONFIG.HIGHLIGHT_BOOST_PX;
    const m = k * 0.75;
    ticks[i].style.height = h.toFixed(1) + 'px';
    ticks[i].style.backgroundColor =
      `rgb(${lerp(C0[0], C1[0], m) | 0},${lerp(C0[1], C1[1], m) | 0},${lerp(C0[2], C1[2], m) | 0})`;
  }
}

/* haptics: a light tick for every tick mark crossed, a stronger pulse at each stage change.
   Android/Chrome use navigator.vibrate; iOS 17.4+ Safari gets a tap through a hidden <input switch>. */
const HAPTICS = CONFIG.HAPTICS !== false;
const hapticSwitch = (() => {
  const l = document.createElement('label');
  l.setAttribute('aria-hidden', 'true');
  l.style.cssText = 'position:fixed;left:-99px;top:-99px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
  const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l); return l;
})();
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let lastBuzz = 0, lastTick = -1, lastStageIdx = -1;
function buzz(ms) {
  if (!HAPTICS || reduceMotion) return;
  const now = performance.now(); if (now - lastBuzz < 24) return; lastBuzz = now;
  // every iPhone/iPad browser (Safari, Chrome, Firefox, Edge...) runs on WebKit, so the switch tap works in all of them;
  // everywhere else the Vibration API is used, and the switch is the fallback if it is missing
  try {
    if (IS_IOS || !navigator.vibrate) hapticSwitch.click();
    else navigator.vibrate(ms);
  } catch (_) {}
}
function hapticFor(t) {
  const ti = Math.round(t * (ticks.length - 1)), si = STAGES.indexOf(stageAt(t));
  if (lastTick < 0) { lastTick = ti; lastStageIdx = si; return; }
  if (si !== lastStageIdx) buzz(18);
  else if (ti !== lastTick) buzz(5);
  lastTick = ti; lastStageIdx = si;
}

/* pointer scrubbing: drag anywhere on the strip */
function setFromPointer(e) {
  const rect = scrubber.getBoundingClientRect();
  targetT = clamp01((e.clientX - rect.left) / rect.width);
  hapticFor(targetT);
}
let dragging = false;
const hintEl = document.getElementById('hint');
const hideHint = () => hintEl && hintEl.classList.add('gone');
scrubber.addEventListener('pointerdown', hideHint, { once: true });
scrubber.addEventListener('keydown', hideHint, { once: true });
scrubber.addEventListener('pointerdown', e => {
  dragging = true;
  lastTick = -1; buzz(8);
  scrubber.setPointerCapture(e.pointerId);
  scrubber.focus({ preventScroll: true });
  setFromPointer(e);
});
scrubber.addEventListener('pointermove', e => { if (dragging) setFromPointer(e); });
['pointerup', 'pointercancel'].forEach(ev =>
  scrubber.addEventListener(ev, e => {
    dragging = false;
    if (scrubber.hasPointerCapture(e.pointerId)) scrubber.releasePointerCapture(e.pointerId);
  }));

/* keyboard */
window.addEventListener('pointerdown', () => document.body.classList.remove('kbd'));
scrubber.addEventListener('keydown', e => {
  document.body.classList.add('kbd');
  const step = CONFIG.KEY_STEP * (e.shiftKey ? 5 : 1);
  let handled = true;
  switch (e.key) {
    case 'ArrowRight': case 'ArrowUp':   targetT = clamp01(targetT + step); break;
    case 'ArrowLeft':  case 'ArrowDown': targetT = clamp01(targetT - step); break;
    case 'PageUp':   targetT = clamp01(targetT + 0.1); break;
    case 'PageDown': targetT = clamp01(targetT - 0.1); break;
    case 'Home': targetT = 0; break;
    case 'End':  targetT = 1; break;
    default: handled = false;
  }
  if (handled) { e.preventDefault(); hapticFor(targetT); }
});

/* =====================================================================
   4. CAPTION + SCENE HOOKS
   ===================================================================== */
const titleEl = document.getElementById('title');
const detailEl = document.getElementById('detail');
const shadowEl = document.getElementById('shadow');
const placeholderEl = document.getElementById('placeholder');
let currentStageId = null;

function updateCaption(t) {
  const s = stageAt(t);
  const day = Math.round(t * CONFIG.TOTAL_DAYS);
  detailEl.textContent = s.detail(day);

  if (s.id !== currentStageId) {
    const first = currentStageId === null;
    currentStageId = s.id;
    if (first || reduceMotion) { titleEl.textContent = s.title; }
    else {
      titleEl.classList.add('swap');
      setTimeout(() => { titleEl.textContent = s.title; titleEl.classList.remove('swap'); }, 120);
    }
  }
  const pct = Math.round(targetT * 100);
  scrubber.setAttribute('aria-valuenow', pct);
  scrubber.setAttribute('aria-valuetext', `${s.title}, day ${day}`);
}

/* Scene hook: later stages replace the placeholder with the voxel scene.
   Anything that needs the global progress value subscribes here. */
const sceneListeners = [];
window.butterflyLife = {
  CONFIG, STAGES,
  getT: () => shownT,
  getTarget: () => targetT,
  stageAt,
  onFrame: fn => sceneListeners.push(fn),
};

function renderScene(t, dt) {
  shadowEl.style.setProperty('--shadow-scale', lerp(CONFIG.SHADOW_SCALE_MIN, CONFIG.SHADOW_SCALE_MAX, t).toFixed(3));
  for (const fn of sceneListeners) fn(t, dt);
}

/* =====================================================================
   4b. VOXEL ENGINE + RENDER PIPELINE (Stage 2)
   - Everything is built from unit cubes in one InstancedMesh per model.
   - The scene renders into a low-res target (1/PIXEL_SCALE of the screen),
     an optional edge pass adds a dark outline, and the canvas is upscaled
     with image-rendering: pixelated.
   ===================================================================== */
const sceneEl = document.getElementById('scene');
const glCanvas = document.getElementById('gl');

function initVoxelScene() {
  if (typeof THREE === 'undefined') throw new Error('Three.js not loaded');
  const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);                       // internal res is controlled by PIXEL_SCALE only
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  /* ---- scene, lights, camera ---- */
  const scene = new THREE.Scene();
  const world = new THREE.Group();                 // swayed as a whole
  scene.add(world);
  scene.add(new THREE.AmbientLight(0xffffff, CONFIG.LIGHT_AMBIENT));
  const sun = new THREE.DirectionalLight(0xffffff, CONFIG.LIGHT_DIRECTIONAL);
  sun.position.set(-0.6, 1, 0.7).multiplyScalar(60);
  sun.castShadow = true; sun.shadow.mapSize.set(CONFIG.SHADOW_MAP, CONFIG.SHADOW_MAP);
  Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 220 });
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05;
  scene.add(sun); scene.add(sun.target);

  const NEAR = 1, FAR = 300;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, NEAR, FAR);
  {
    const el = CONFIG.CAMERA_ELEVATION_DEG * Math.PI / 180, az = CONFIG.CAMERA_AZIMUTH_DEG * Math.PI / 180, dist = 120;
    camera.position.set(Math.sin(az) * Math.cos(el) * dist, CONFIG.CAMERA_LOOK_Y + Math.sin(el) * dist, Math.cos(az) * Math.cos(el) * dist);
    camera.lookAt(0, CONFIG.CAMERA_LOOK_Y, 0);
  }

  /* ---- helpers ---- */
  const sm = (a, b, x) => { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); };  // smoothstep
  const hash3 = (a, b, c) => { const v = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return v - Math.floor(v); };
  const TAU = Math.PI * 2;

  /* =================================================================
     MONARCH UNIT = leaf + curved twig + egg + caterpillar + chrysalis.
     Every unit has its own progress p (global t, staggered).
       p 0.00-0.12 egg | 0.12-0.25 hatching | 0.25-0.50 growing caterpillar
       p 0.50-0.58 J-hang | 0.58-0.80 chrysalis (Stage 4)
     Unit-local axes: +x along the leaf (caterpillar heads towards +x), y up.
     ================================================================= */

  /* =================================================================
     FINE-PIXEL STYLE  (life stages 1-2 and all scenery)
     Textured, smooth-shaded meshes are drawn into the same low-res target
     as the voxel models. Lighting is quantised with an ordered (Bayer)
     dither, so gradients and shadows break into tiny 1-pixel patterns
     like hand-dithered pixel art. Textures are painted procedurally.
     Unit-local axes: +x along the leaf, y up.
     ================================================================= */
  const FINE_U = { uLv: { value: CONFIG.DITHER_LEVELS - 1 }, uDither: { value: CONFIG.DITHER_STRENGTH } };
  const DITHER_GLSL = `
    float bx = mod(floor(gl_FragCoord.x), 4.0), by = mod(floor(gl_FragCoord.y), 4.0);
    float x0 = mod(bx, 2.0), x1 = floor(bx / 2.0), y0 = mod(by, 2.0), y1 = floor(by / 2.0);
    float bayer = (8.0 * abs(x0 - y0) + 4.0 * y0 + 2.0 * abs(x1 - y1) + y1 + 0.5) / 16.0 - 0.5;
    gl_FragColor.rgb = floor(gl_FragColor.rgb * uLv + 0.5 + bayer * uDither) / uLv;`;

  /* Lambert material whose final colour is Bayer-dithered; `hook` can patch the shaders (bites, egg cut, ...) */
  function fineMat(opts, key, hook) {
    const m = new THREE.MeshLambertMaterial(opts);
    m.customProgramCacheKey = () => 'fine-' + key;          // programs differ per hook, so key them
    m.onBeforeCompile = sh => {
      sh.uniforms.uLv = FINE_U.uLv; sh.uniforms.uDither = FINE_U.uDither;
      sh.fragmentShader = 'uniform float uLv;\nuniform float uDither;\n' + sh.fragmentShader.replace('#include <dithering_fragment>', DITHER_GLSL);
      if (hook) hook(sh);
    };
    return m;
  }
  const withLoc = sh => {                                      // expose model-space position to the fragment shader
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc;').replace('#include <begin_vertex>', '#include <begin_vertex>\nvLoc = position;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vLoc;\nfloat h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }');
  };

  /* ---- painted-texture toolkit ---- */
  const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const rgbOf = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mkRamp = a => a.map(rgbOf);
  const RAMP = {                                               // shading ramps, dark -> light

  /* ---- leaf geometry + texture (the mesh follows the old voxel leaf outline, so the caterpillar still fits) ---- */
  const LEAF = { x0: -6.4, len: 13.2, maxW: 4.3 };
  const leafHalfW = x => {
    const u = (x - LEAF.x0) / LEAF.len;
    return (u <= 0 || u >= 1) ? -1 : LEAF.maxW * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), 0.8);

  const leafTop = x => LEAF_TOP + leafY(x, 0) - 0.09;          // surface height along the midrib (creatures walk on this)
  function leafGeometry() {

  /* ---- tapered tube (twig, petiole, larva, roots). Normals are analytic, so it stays smooth even when re-posed ---- */
  function makeTube(n, radial) {

  /* ---- twig + petiole ---- */
  const GROUND_TOP = CONFIG.GROUND_TOP;
  const TWIG_P = [[-8.2, GROUND_TOP - 0.1], [-9.4, 4.6], [-7.2, 11.4], [-0.5, 11.0]];       // cubic bezier (x, y)

  const TWIG_PTS = (() => {                                    // dense centre-line, also used to find the hang point
    const a = [];
    for (let n = 0; n <= 140; n++) { const t = n / 140, [x, y] = bez3(TWIG_P, t); a.push({ x, y, z: 0.45 * Math.sin(t * 5), r: twigR(t), t }); }
    return a;
  })();
  const ANCHOR = (() => {                                      // hang point: underside of the branch near its free end
    const cand = TWIG_PTS.filter(p => p.y > 9).sort((p, q) => Math.abs(p.x + 2.8) - Math.abs(q.x + 2.8))[0];

  })();
  function twigGeometry() {
    const n = 72, g = makeTube(n, 9), pts = [], rad = [];
    for (let i = 0; i < n; i++) { const p = TWIG_PTS[Math.round(i / (n - 1) * 140)]; pts.push([p.x, p.y, p.z]); rad.push(i === n - 1 ? 0.02 : p.r); }

  }
  function petioleGeometry() {                                 // short curved stalk dipping a little before it rises to the twig

  function barkTexture() {
    return paint(32, 64, (x, y) => {

      let t = 0.42 + 0.5 * (fbm(nx, ny, 5) - 0.5) + 0.35 * (vnoise(Math.cos(a) * 3 + 4, Math.sin(a) * 3 + y * 0.04, 8) - 0.5);   // long bark grooves

      if (x > 5 && x < 10) t += 0.1;                                                                                               // pixel highlight streak

      return pick(RAMP.bark, t, x, y);

  function stemTexture() {
    return paint(8, 16, (x, y) => pick(RAMP.stem, 0.5 + 0.22 * Math.sin(x / 8 * TAU + 0.6) + 0.1 * (hash3(x, y, 3) - 0.5), x, y), true);
  }

  /* ---- egg: ridged ovoid (lathe) with painted shell ---- */
  const EGG_H = 1.5, EGG_R = 0.62;

    const pts = [];

  const CAT_LEN = 12;

  // caterpillar growth: stepped instars with a quick molt jump between them
  const INSTAR_T = [0.12, 0.23, 0.30, 0.36, 0.42, 0.46, 0.50];

  /* ---- fine-style creatures + per-unit assembly (leaf, twig, egg, hatchling) ---- */

  const SH = {};

    SH.leafGeo = leafGeometry(); SH.leafTex = leafTexture();

  function makeFineUnit(group, index) {
    const S0 = fineShared(), shadowed = m => { m.castShadow = m.receiveShadow = true; m.frustumCulled = false; return m; };
    const add = (geo, mat) => group.add(shadowed(new THREE.Mesh(geo, mat)));

    // leaf: bite marks are carved in the shader from per-bite (x, z, radius, time) data
    const bu = { uP: { value: 0 }, uBites: { value: BITES.map(b => new THREE.Vector4(b[0], b[1], b[2], b[3])) } };
    const leafM = fineMat({ map: S0.leafTex, side: THREE.DoubleSide, alphaTest: 0.5 }, 'leaf', sh => {
      sh.uniforms.uP = bu.uP; sh.uniforms.uBites = bu.uBites; withLoc(sh);
      sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nuniform float uP;\nuniform vec4 uBites[5];').replace('#include <alphatest_fragment>', `

          if (f > 0.001) {
            float n = h21(floor(vLoc.xz * 5.0) + float(i) * 3.7);

    [[0.985, 0.25, 0.0, 0.22], [0.985, 0.0, 2.5, 0.2], [0.7, 0.2, Math.PI - 0.5, 0.17]].forEach(([t, rz, ry, s]) => {
      const p = TWIG_PTS[Math.round(t * 140)], m = new THREE.Mesh(S0.smallLeafGeo, S0.plainLeafM);
      m.position.set(p.x, p.y + 0.05, p.z); m.rotation.set(0, ry, rz); m.scale.setScalar(s); group.add(shadowed(m));
    });

    [[-3.6, 1.1, 0.27], [-0.9, -1.5, 0.21], [2.3, 1.6, 0.25]].forEach(([x, z, r]) => {

        eu.uCut.value = p < 0.2 ? lerp(3, 0.62, sm(0.12, 0.165, p)) : lerp(0.62, -0.5, sm(0.2, 0.27, p));

  }

  // centre-line of the body for a given distance s from the head: crawling on the leaf, or hanging in a J

          vec3 nc = texture2D(tColor, vUv + o * uTexel).rgb;
          if (dc >= 0.9999 && dot(nc, vec3(.299, .587, .114)) < 0.15 && d(o * 2.) >= 0.9999) {   // a 1-pixel dark hair (antenna): an outline would only fatten it
            gl_FragColor = dc >= 0.9999 ? vec4(0.0) : vec4(texture2D(tColor, vUv).rgb, 1.0); return;
          }
          vec3 oc = nc * 0.38;
          if (dc >= 0.9999) oc = mix(oc, uOutline, 0.55);        // silhouettes keep a firmer edge, inner edges just darken
          gl_FragColor = vec4(oc, 1.0); return;
        }
        if (dc >= 0.9999) { gl_FragColor = vec4(0.0); return; }                          // empty background stays transparent
        gl_FragColor = vec4(texture2D(tColor, vUv).rgb, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  });
  const postScene = new THREE.Scene();
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  /* ---- sizing: each art pixel is a whole number of DEVICE pixels, so pixels stay crisp and evenly sized on every screen ---- */
  let target = null, lw = 0, lh = 0, ldpr = 0;
  function resize() {
    const r = sceneEl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    let dp = Math.max(2, Math.round(CONFIG.PIXEL_SCALE * dpr));     // never finer than 2 device px, or it would stop looking like pixel art
    dp = Math.max(1, Math.min(dp, Math.floor(r.width * dpr / CONFIG.MIN_INTERNAL_RES)));
    const w = Math.max(48, Math.floor(r.width * dpr / dp)), h = Math.max(48, Math.floor(r.height * dpr / dp));
    if (w === lw && h === lh && dpr === ldpr) return;
    lw = w; lh = h; ldpr = dpr;
    renderer.setSize(w, h, false);
    glCanvas.style.width = (w * dp / dpr) + 'px'; glCanvas.style.height = (h * dp / dpr) + 'px';      // exact multiple -> perfectly even pixels
    const asp = w / h, vs = CONFIG.VIEW_SIZE / 2;
    camera.left = -vs * asp; camera.right = vs * asp; camera.top = vs; camera.bottom = -vs;
    camera.updateProjectionMatrix();
    // float the shadow just below the models: project a world point under them to screen space
    camera.updateMatrixWorld(true);
    const sp = new THREE.Vector3(0, CONFIG.GROUND_Y - CONFIG.SHADOW_DROP, 0).project(camera);
    shadowEl.style.top = ((1 - sp.y) / 2 * 100).toFixed(2) + '%';
    shadowEl.style.width = (2 * CONFIG.SHADOW_RADIUS / (CONFIG.VIEW_SIZE * asp) * 100).toFixed(1) + '%';
    if (target) target.dispose();
    target = new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
    target.depthTexture = new THREE.DepthTexture(w, h);
    target.depthTexture.type = THREE.UnsignedIntType;
    postMat.uniforms.tColor.value = target.texture;
    postMat.uniforms.tDepth.value = target.depthTexture;
    postMat.uniforms.uTexel.value.set(1 / w, 1 / h);
    // A flat floor changes depth by (world-units-per-pixel / tan(elevation)) per pixel; stay above that.
    const wpp = CONFIG.VIEW_SIZE / h;
    postMat.uniforms.uThr.value = CONFIG.OUTLINE_DEPTH_FACTOR * 0.5 * wpp / Math.tan(CONFIG.CAMERA_ELEVATION_DEG * Math.PI / 180);
  }
  new ResizeObserver(resize).observe(sceneEl); window.addEventListener('resize', resize);
  resize();

  /* ---- per-frame: sway, update models, draw ---- */
  let clock = 0;
  window.butterflyLife.onFrame((t, dt) => {
    if (!reduceMotion) world.rotation.y += CONFIG.ROTATION_SPEED * dt;   // slow turntable
    clock += dt;
    for (const u of units) u.update(t, clock);
        if (CONFIG.OUTLINE) {
      renderer.setRenderTarget(target); renderer.clear(); renderer.render(scene, camera);
      renderer.setRenderTarget(null);   renderer.clear(); renderer.render(postScene, postCam);
    } else {
      renderer.setRenderTarget(null); renderer.clear(); renderer.render(scene, camera);
    }
  });

  // for later stages / debugging
  Object.assign(window.butterflyLife, { THREE, scene, world, camera, units, PALETTE });
}

try { initVoxelScene(); }
catch (err) { console.warn('Voxel scene unavailable, showing placeholder:', err); sceneEl.classList.add('nogl'); }

/* =====================================================================
   5. MAIN LOOP (eased tweening toward targetT)
   ===================================================================== */
let last = performance.now();
let lastPainted = -1;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (reduceMotion) shownT = targetT;
  else shownT += (targetT - shownT) * (1 - Math.exp(-CONFIG.TWEEN_SPEED * dt));
  if (Math.abs(targetT - shownT) < 0.0002) shownT = targetT;

  if (shownT !== lastPainted) { paintScrubber(shownT); lastPainted = shownT; }
  updateCaption(shownT);
  renderScene(shownT, dt);
  requestAnimationFrame(frame);
}
paintScrubber(0);
requestAnimationFrame(frame);
</script>
</body>
